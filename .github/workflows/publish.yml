name: Deploy redirects to canonical website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate page-preserving redirects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          root = Path('_redirects')
          root.mkdir()
          base = 'https://yilun1225.github.io/'
          script = '''<script>
          (function () {
            var path = window.location.pathname.replace(/^\/my-site(?:\/|$)/, '');
            var target = 'https://yilun1225.github.io/' + path.replace(/^\/+/, '') + window.location.search + window.location.hash;
            window.location.replace(target);
          })();
          </script>'''
          for page in ['index.html', 'about.html', 'cv.html', 'publication.html', 'publication_bydate.html', '404.html']:
              target = base + ('' if page in ['index.html', '404.html'] else page)
              document = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Yilun Chen - Page moved</title>'
              document += '<link rel="canonical" href="' + html.escape(target, quote=True) + '">' + script
              document += '<noscript><meta http-equiv="refresh" content="0;url=' + html.escape(target, quote=True) + '"></noscript></head><body><p>This page has moved to <a href="' + html.escape(target, quote=True) + '">the new website</a>.</p></body></html>'
              (root / page).write_text(document)
          (root / '.nojekyll').touch()
          PY
      - name: Upload redirects
        uses: actions/upload-pages-artifact@v3
        with:
          path: _redirects
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy redirects
        id: deployment
        uses: actions/deploy-pages@v4
