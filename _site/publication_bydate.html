<script>
window.addEventListener('DOMContentLoaded', () => {
  const dataEl = document.getElementById('papers-data');
  const PAPERS = JSON.parse((dataEl?.textContent || '[]').trim());

  const ulPre = document.getElementById('pub-preprint');
  const ulPub = document.getElementById('pub-published');

  function inferBucket(status) {
    const s = (status || '').toLowerCase();
    return (s.includes('published') || s.startsWith('forthcoming') ||
            s.startsWith('accepted') || s.includes('conditionally accepted'))
      ? 'Published' : 'Preprint';
  }

  const byYear = (a, b) => {
    if (b.year !== a.year) return b.year - a.year;
    if (a.rank !== undefined && b.rank !== undefined) return a.rank - b.rank;
    if (a.rank !== undefined) return -1;
    if (b.rank !== undefined) return 1;
    return a.title.localeCompare(b.title);
  };

  function liFor(p) {
    const li = document.createElement('li');
    li.className = 'paper';

    const titleP = document.createElement('p');
    titleP.className = 'title';
    const a = document.createElement('a');
    a.href = p.url || '#';
    a.target = '_blank';
    a.textContent = p.title;
    titleP.appendChild(a);
    if (p.authors && p.authors.trim()) {
      const spanAuth = document.createElement('span');
      spanAuth.className = 'authors-after';
      spanAuth.textContent = ` (with ${p.authors})`;
      titleP.appendChild(spanAuth);
    }
    li.appendChild(titleP);

    if (p.status && p.status.trim()) {
      const st = document.createElement('div');
      st.className = 'status-line';
      st.innerHTML = (p.status || '').replace(/\n/g, '<br>');
      li.appendChild(st);
    }

    if (p.awards && p.awards.length) {
      const wrap = document.createElement('div');
      wrap.className = 'awards-wrap';
      const ul = document.createElement('ul');
      ul.className = 'awards-list';
      (p.awards || []).forEach(w => {
        const liw = document.createElement('li');
        liw.className = 'award-item ' + ((w.type === 'other') ? 'other' : 'award');
        liw.innerHTML = w.text;
        ul.appendChild(liw);
      });
      wrap.appendChild(ul);
      li.appendChild(wrap);
    }

    const teaserP = document.createElement('p');
    teaserP.className = 'teaser';
    const spanTeaser = document.createElement('span');
    spanTeaser.className = 'teaser-text';
    spanTeaser.textContent = p.teaser || '';
    teaserP.appendChild(spanTeaser);

    if (p.abstract && p.abstract.trim()) {
      const more = document.createElement('button');
      more.className = 'more-btn';
      more.textContent = '[more]';
      teaserP.appendChild(more);

      const absP = document.createElement('p');
      absP.className = 'abstract hidden';
      absP.textContent = p.abstract + ' ';
      const lessBtn = document.createElement('button');
      lessBtn.className = 'less-btn';
      lessBtn.textContent = '[less]';
      absP.appendChild(lessBtn);

      more.addEventListener('click', () => {
        spanTeaser.classList.add('hidden');
        more.classList.add('hidden');
        absP.classList.remove('hidden');
      });
      lessBtn.addEventListener('click', () => {
        absP.classList.add('hidden');
        spanTeaser.classList.remove('hidden');
        more.classList.remove('hidden');
      });

      li.appendChild(teaserP);
      li.appendChild(absP);
    } else {
      li.appendChild(teaserP);
    }

    return li;
  }

  const preprint = [], published = [];
  PAPERS.forEach(p => {
    const bucket = (p.bucket || inferBucket(p.status) || '').toLowerCase();
    (bucket.startsWith('pub') || bucket.startsWith('acc') ? published : preprint).push(p);
  });

  preprint.sort(byYear);
  published.sort(byYear);

  preprint.forEach(p => ulPre.appendChild(liFor(p)));
  published.forEach(p => ulPub.appendChild(liFor(p)));
});
</script>

  window.document.addEventListener("DOMContentLoaded", function (event) {

      for (const clz of el.classList) {
        if (clz.startsWith('code-annotation-')) {                     
          return true;
        }
      }
      return false;
    }
    const onCopySuccess = function(e) {
      // button target
      const button = e.trigger;
      // don't keep focus
      button.blur();
      // flash "checked"
      button.classList.add('code-copy-button-checked');
      var currentTitle = button.getAttribute("title");
      button.setAttribute("title", "Copied!");
      let tooltip;
      if (window.bootstrap) {
        button.setAttribute("data-bs-toggle", "tooltip");
        button.setAttribute("data-bs-placement", "left");
        button.setAttribute("data-bs-title", "Copied!");

            offset: [0, -8]});

      }
      setTimeout(function() {
        if (tooltip) {
          tooltip.hide();
          button.removeAttribute("data-bs-title");
          button.removeAttribute("data-bs-toggle");
          button.removeAttribute("data-bs-placement");
        }
        button.setAttribute("title", currentTitle);
        button.classList.remove('code-copy-button-checked');
      }, 1000);

      e.clearSelection();
    }
    const getTextToCopy = function(trigger) {
      const outerScaffold = trigger.parentElement.cloneNode(true);

          childEl.remove();
        }
      }
      return codeEl.innerText;
    }
    const clipboard = new window.ClipboardJS('.code-copy-button:not([data-in-quarto-modal])', {
      text: getTextToCopy
    });
    clipboard.on('success', onCopySuccess);
    if (window.document.getElementById('quarto-embedded-source-code-modal')) {

      function throttle(fn, ms) {
      let throttle = false;

        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
